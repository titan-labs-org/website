<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Titan Labs</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Lato", Helvetica, Arial, sans-serif;
      font-size: 1.1rem;
      color: #111;
      background-color: #fff;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    header {
      text-align: center;
      padding: 20px 20px 16px 20px;
    }
    header img {
      display: block;
      width: 160px;
      max-width: 40vw;
      margin: 0 auto 0.05rem auto;
    }
    h1 {
      display: inline-block;
      font-family: "Cinzel", serif;
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      line-height: 1.1;
      margin: 0 0 0.05rem 0;
    }
    header p {
      line-height: 1.2;
      margin: 0 auto;
      text-align: center;
    }
    main {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px 20px 20px;
      box-sizing: border-box;
    }
    main p {
      margin: 0.8rem 0;
      text-align: center;
    }
    strong {
      color: #000;
    }
    #contact {
      text-align: center;
      margin-top: 1.5rem;
    }
    #contact a {
      font-size: 80%;
      display: inline-block;
      max-width: 100%;
      color: #0056b3;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    #contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Titan Labs logo">
    <h1>Titan Labs</h1>
  </header>
  <script>
    function syncHeaderWidths() {
      var title = document.querySelector('header h1');
      var w = title.getBoundingClientRect().width;
      if (!w) return;
      document.querySelector('header img').style.width = (w * 0.7) + 'px';
      document.querySelector('header p').style.width = w + 'px';
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(syncHeaderWidths);
    }
    window.addEventListener('load', syncHeaderWidths);
    window.addEventListener('resize', syncHeaderWidths);
  </script>
  <main>
      <p>Titan Labs helps investors and founders understand what might go wrong in complex technical products deployed in markets that don't forgive a system going down.</p>
      <p>Based on years of building teams and systems at early-stage ventures.</p>
      <section id="contact">
      <a href="mailto:contact@titan-labs.dev">contact@titan-labs.dev</a>
    </section>
  </main>
</body>
</html>
